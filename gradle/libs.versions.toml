# Every version below was checked against maven-metadata.xml on Maven Central /
# plugins.gradle.org before being written here. Do not guess versions.
[versions]
kotlin = "2.2.21"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.9.0"
# NOTE: SQLDelight 2.2.1, not 2.4.x. SQLDelight 2.3.x/2.4.x are built with Kotlin 2.3.10: their klibs have
# ABI 2.3.0, which the Kotlin/Native 2.2.21 compiler refuses (iOS compilation fails), and on the JVM they drag
# kotlin-stdlib up to 2.3.10. 2.2.1 is built with exactly Kotlin 2.2.21 / kotlinx-coroutines 1.10.2.
# Move to 2.4.x together with a Kotlin 2.3 upgrade.
sqldelight = "2.2.1"
# Compose Multiplatform 1.9.3: the newest 1.9.x (the 1.9 line is built for Kotlin 2.2.x; 1.10+ is outside the
# plan's 1.9.x scope). Material3 has its own version line inside CMP (1.9.0 ships with CMP 1.9.x).
compose-multiplatform = "1.9.3"
compose-material3 = "1.9.0"
# Android Gradle Plugin 8.13.2: newest 8.x on Google Maven; AGP 8.13 requires Gradle >= 8.13 (wrapper is 8.14.3).
# AGP 9 needs Gradle 9, so it is out of reach for this wrapper.
agp = "8.13.2"
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"
android-buildTools = "36.0.0"
# activity 1.11.0 / core 1.17.0: the newest stable lines that compile against SDK 36 (both need compileSdk 36).
androidx-activity = "1.11.0"
androidx-core = "1.17.0"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
# Multiplatform BackHandler (Android system back; no-op on desktop). Same version line as Compose Multiplatform.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
