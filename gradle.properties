# Gradle
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# iOS targets cannot be compiled on a Linux host; Kotlin/Native skips them.
# This turns that into a non-fatal notice instead of a build warning/error.
kotlin.native.ignoreDisabledTargets=true

# Android
# NOTE(T3): required by AGP as soon as any androidx dependency is on the classpath.
android.useAndroidX=true
